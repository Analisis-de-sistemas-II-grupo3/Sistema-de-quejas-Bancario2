spring.application.name=Sistema de Quejas Bancario - CU00 a CU04
# Identidad institucional configurable (RN22 / CU00).
institucion.nombre=Banco Confianza
institucion.siglas=BC
institucion.color-primario=#4A1830
institucion.color-secundario=#D8A348
institucion.logo-url=/img/logo-banco.svg
# El límite por rol se valida en ServicioEvidencias: 2 MB para Cliente y 10 MB para Agente.
# Spring debe aceptar primero el máximo permitido para que esa regla pueda aplicarse.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
adjuntos.directorio=uploads
# CU01 FA03: cierre de sesion automatico por inactividad (configurable, valor en minutos).
server.servlet.session.timeout=15m

spring.datasource.url=jdbc:postgresql://ep-sweet-violet-ayas8j66-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.profiles.active=local
