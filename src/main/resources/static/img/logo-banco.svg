<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Icono del Sistema de Quejas Bancario" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sistema de Quejas Bancario</title>
  <defs>
    <linearGradient id="gradEscudo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D2942"/>
      <stop offset="100%" stop-color="#351020"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#sombra)">
    <!-- Escudo -->
    <path d="M32 3 C39 3 46 6 51 10 L51 26 C51 41 43 50 32 55 C21 50 13 41 13 26 L13 10 C18 6 25 3 32 3 Z"
          fill="url(#gradEscudo)" stroke="#D8A348" stroke-width="2"/>

    <!-- Fachada bancaria: pediment + columnas + base -->
    <path d="M20 24 L44 24 L32 13 Z" fill="#FFFFFF"/>
    <rect x="18" y="24" width="28" height="3" fill="#FFFFFF"/>
    <rect x="20" y="29" width="3" height="12" fill="#FFFFFF"/>
    <rect x="27" y="29" width="3" height="12" fill="#FFFFFF"/>
    <rect x="34" y="29" width="3" height="12" fill="#FFFFFF"/>
    <rect x="41" y="29" width="3" height="12" fill="#FFFFFF"/>
    <rect x="17" y="41" width="30" height="4" rx="1" fill="#FFFFFF"/>

    <!-- Insignia de caso resuelto -->
    <circle cx="48" cy="48" r="11" fill="#D8A348" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M42 48 L46 52 L54 42" fill="none" stroke="#FFFFFF" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
