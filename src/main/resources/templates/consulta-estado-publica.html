<!doctype html>
<html lang="es" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="'Consultar estado | ' + ${institucion.nombre}">Consultar estado</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/estilos-institucionales.css}" rel="stylesheet"></head>
<body th:style="|--color-principal:${institucion.colorPrimario};--color-secundario:${institucion.colorSecundario};|">
<header class="barra-principal"><nav class="container py-3"><a class="marca" th:href="@{/}"><span class="marca-sello" th:text="${institucion.siglas}">BC</span><span th:text="${institucion.nombre}">Banco</span></a></nav></header>
<main class="container py-5 d-flex justify-content-center">
  <div class="card tarjeta-elevada" style="max-width:480px;width:100%">
    <div class="card-body p-4 p-md-5">
      <p class="text-uppercase small fw-semibold mb-2" style="color:var(--color-secundario)">Consulta pública</p>
      <h1 class="h3 mb-1">Consultar estado de un caso</h1>
      <p class="text-secondary small mb-4">Ingresa el folio de tu caso y el correo o DPI/NIT con el que lo registraste.</p>
      <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
      <form th:action="@{/consulta-estado/publica}" th:object="${formulario}" method="post">
        <div class="mb-3">
          <label class="form-label" for="folio">Número de folio</label>
          <input id="folio" th:field="*{folio}" class="form-control" placeholder="Q-00001-2026" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="datoVerificacion">Correo electrónico o DPI/NIT</label>
          <input id="datoVerificacion" th:field="*{datoVerificacion}" class="form-control" placeholder="tucorreo@correo.com o DPI/NIT" required>
        </div>
        <button class="btn boton-principal w-100" type="submit">Consultar</button>
      </form>
      <div class="text-center mt-4">
        <a class="enlace-suave small" th:href="@{/login}">¿Ya tienes cuenta? Inicia sesión para ver todos tus casos</a><br>
        <a class="enlace-suave small" th:href="@{/}">Volver al inicio</a>
      </div>
    </div>
  </div>
</main>
</body></html>
