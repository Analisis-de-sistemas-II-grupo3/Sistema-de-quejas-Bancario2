<!doctype html>
<html lang="es" xmlns:th="https://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Banco</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light"><main class="container py-4 py-md-5 d-flex justify-content-center">
  <div class="card shadow-sm" style="max-width:420px;width:100%">
    <div class="card-body p-4">
      <h1 class="h3 mb-1">Iniciar sesión</h1>
      <p class="text-secondary small mb-4">Quejas, Reclamos, Denuncias y Sugerencias</p>
      <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
      <form th:action="@{/login}" th:object="${credenciales}" method="post">
        <div class="mb-3">
          <label class="form-label" for="usuario">Usuario</label>
          <input id="usuario" th:field="*{usuario}" class="form-control" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="contrasena">Contraseña</label>
          <input id="contrasena" type="password" th:field="*{contrasena}" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
      </form>
    </div>
  </div>
</main></body></html>
