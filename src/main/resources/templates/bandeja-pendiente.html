<!doctype html>
<html lang="es" xmlns:th="https://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' | Banco'">Bandeja</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light"><main class="container py-4 py-md-5" style="max-width:720px">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-0" th:text="${titulo}"></h1>
      <p class="text-secondary small mb-0" th:if="${sesion != null}">
        Sesión: <strong th:text="${sesion.usuario}"></strong> (<span th:text="${sesion.rol}"></span>)
      </p>
    </div>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/logout}">Cerrar sesión</a>
  </div>
  <div class="alert alert-secondary">
    Esta bandeja se implementará en su caso de uso correspondiente. CU01 solo valida el acceso y el enrutamiento por rol.
  </div>
</main></body></html>
