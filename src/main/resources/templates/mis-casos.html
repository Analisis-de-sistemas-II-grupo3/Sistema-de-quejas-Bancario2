<!doctype html>
<html lang="es" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="'Mis casos | ' + ${institucion.nombre}">Mis casos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/estilos-institucionales.css}" rel="stylesheet"></head>
<body th:style="|--color-principal:${institucion.colorPrimario};--color-secundario:${institucion.colorSecundario};|">
<header class="barra-principal"><nav class="container py-3 d-flex justify-content-between align-items-center">
  <a class="marca" th:href="@{/}"><span class="marca-sello" th:text="${institucion.siglas}">BC</span><span th:text="${institucion.nombre}">Banco</span></a>
  <a class="enlace-suave small" th:href="@{/logout}">Cerrar sesión</a>
</nav></header>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Mis casos</h1>
    <a class="btn boton-principal" th:href="@{/casos/nuevo}">Registrar nuevo caso</a>
  </div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div th:if="${#lists.isEmpty(casos)}" class="card tarjeta-elevada">
    <div class="card-body p-4 p-md-5 text-center text-secondary">No cuenta con casos registrados.</div>
  </div>
  <div th:unless="${#lists.isEmpty(casos)}" class="card tarjeta-elevada">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead><tr><th>Folio</th><th>Tipo de caso</th><th>Fecha de registro</th><th>Estado actual</th><th>Última actualización</th><th></th></tr></thead>
        <tbody>
          <tr th:each="caso : ${casos}">
            <td th:text="${caso.folio}"></td>
            <td th:text="${caso.tipo}"></td>
            <td th:text="${#temporals.format(caso.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>
            <td><span class="badge boton-secundario" th:text="${caso.estado}"></span></td>
            <td th:text="${#temporals.format(caso.fechaUltimaActualizacion, 'dd/MM/yyyy HH:mm')}"></td>
            <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/consulta-estado/{folio}(folio=${caso.folio})}">Ver detalle</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body></html>
