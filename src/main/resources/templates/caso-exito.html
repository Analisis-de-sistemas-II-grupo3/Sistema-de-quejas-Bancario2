<!doctype html>
<html lang="es" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="'Caso registrado | ' + ${institucion.nombre}">Caso registrado</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/estilos-institucionales.css}" rel="stylesheet"></head>
<body th:style="|--color-principal:${institucion.colorPrimario};--color-secundario:${institucion.colorSecundario};|"><header class="barra-principal"><nav class="container py-3"><a class="marca" th:href="@{/}"><span class="marca-sello" th:text="${institucion.siglas}">BC</span><span th:text="${institucion.nombre}">Banco</span></a></nav></header><main class="container py-5" style="max-width:720px"><div class="card tarjeta-elevada"><div class="card-body p-4 p-md-5"><div class="alert alert-success"><h1 class="h3">Caso registrado con éxito</h1><p class="mb-0">Folio asignado: <strong th:text="${caso.folio}"></strong></p></div><dl class="row"><dt class="col-sm-4">Estado</dt><dd class="col-sm-8" th:text="${caso.estado}"></dd><dt class="col-sm-4">Producto</dt><dd class="col-sm-8" th:text="${caso.producto.nombre}"></dd><dt class="col-sm-4">Agente asignado</dt><dd class="col-sm-8" th:text="${caso.agenteAsignado == null ? 'Pendiente de disponibilidad' : caso.agenteAsignado.nombre}"></dd></dl><a class="btn boton-principal" th:href="@{/casos/{folio}/evidencias(folio=${caso.folio})}">Adjuntar más evidencia</a> <a class="btn btn-outline-secondary" th:href="@{/casos/nuevo}">Registrar otro caso</a> <a class="btn btn-outline-secondary" th:href="@{/logout}">Cerrar sesión</a></div></div></main></body></html>
