<!doctype html>
<html lang="es" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Caso registrado</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:720px"><div class="card shadow-sm"><div class="card-body p-4 p-md-5"><div class="alert alert-success"><h1 class="h3">Caso registrado con éxito</h1><p class="mb-0">Folio asignado: <strong th:text="${caso.folio}"></strong></p></div><dl class="row"><dt class="col-sm-4">Estado</dt><dd class="col-sm-8" th:text="${caso.estado}"></dd><dt class="col-sm-4">Producto</dt><dd class="col-sm-8" th:text="${caso.producto.nombre}"></dd><dt class="col-sm-4">Agente asignado</dt><dd class="col-sm-8" th:text="${caso.agenteAsignado == null ? 'Pendiente de disponibilidad' : caso.agenteAsignado.nombre}"></dd></dl><a class="btn btn-primary" th:href="@{/casos/nuevo}">OK</a> <a class="btn btn-outline-secondary" th:href="@{/logout}">Cerrar sesión</a></div></div></main></body></html>
