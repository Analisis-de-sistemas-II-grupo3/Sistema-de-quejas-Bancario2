<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
</head>
<body class="portal identidad-cargando" data-titulo="Restablecer contraseña">

<div id="spinnerOverlay" class="spinner-overlay">
    <div class="spinner-border" role="status"></div>
</div>

<div class="auth-wrap">
    <aside class="auth-aside">
        <span class="brand-mark">
            <img data-id="logo" alt="" hidden>
            <i class="bi bi-bank2" data-id="logo-fallback"></i>
        </span>
        <h1 data-id="nombre">Sistema de Quejas Bancario</h1>
        <p class="eslogan" data-id="eslogan" hidden></p>
        <div class="hero-sun" aria-hidden="true"></div>
    </aside>

    <main class="auth-main">
        <div class="auth-card">
            <a href="login.html" class="small d-inline-block mb-3"><i class="bi bi-arrow-left me-1"></i>Volver a iniciar sesión</a>
            <h2 class="mb-1">Nueva contraseña</h2>
            <p class="text-muted mb-4">Elija una contraseña nueva para su cuenta.</p>

            <div id="alertas"></div>

            <form id="formReset">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="nuevaContrasena">Nueva contraseña</label>
                    <input type="password" class="form-control" id="nuevaContrasena" autocomplete="new-password" required minlength="8" autofocus>
                    <div class="form-text">Mínimo 8 caracteres, con al menos una letra y un número.</div>
                </div>
                <button type="submit" class="btn btn-brand-solid">Restablecer contraseña</button>
            </form>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/identidad.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

document.getElementById("formReset").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!token) {
        mostrarAlerta("alertas", "El enlace de recuperación no es válido.");
        return;
    }
    const nuevaContrasena = document.getElementById("nuevaContrasena").value;
    mostrarCargando(true);
    try {
        const resp = await apiFetch("/auth/reset-password", { method: "POST", body: { token, nuevaContrasena } });
        mostrarAlerta("alertas", resp.mensaje + " Redirigiendo...", "success");
        setTimeout(() => window.location.href = "login.html", 2000);
    } catch (err) {
        mostrarAlerta("alertas", err.message);
    } finally {
        mostrarCargando(false);
    }
});
Identidad.cargar();
</script>
</body>
</html>
