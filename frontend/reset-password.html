<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer Contraseña</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div id="spinnerOverlay" class="spinner-overlay">
    <div class="spinner-border text-primary" role="status"></div>
</div>
<div class="container">
    <div class="card card-login shadow-sm">
        <div class="card-body p-4">
            <h5 class="mb-3">Restablecer contraseña</h5>
            <div id="alertas"></div>
            <form id="formReset">
                <div class="mb-3">
                    <label class="form-label">Nueva contraseña</label>
                    <input type="password" class="form-control" id="nuevaContrasena" required minlength="8">
                    <div class="form-text">Mínimo 8 caracteres, con al menos una letra y un número.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Restablecer</button>
                <div class="text-center mt-3">
                    <a href="index.html" class="small">Volver a inicio de sesión</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

document.getElementById("formReset").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!token) {
        mostrarAlerta("alertas", "El enlace de recuperación no es válido.");
        return;
    }
    const nuevaContrasena = document.getElementById("nuevaContrasena").value;
    mostrarCargando(true);
    try {
        const resp = await apiFetch("/auth/reset-password", { method: "POST", body: { token, nuevaContrasena } });
        mostrarAlerta("alertas", resp.mensaje + " Redirigiendo...", "success");
        setTimeout(() => window.location.href = "index.html", 2000);
    } catch (err) {
        mostrarAlerta("alertas", err.message);
    } finally {
        mostrarCargando(false);
    }
});
</script>
</body>
</html>
