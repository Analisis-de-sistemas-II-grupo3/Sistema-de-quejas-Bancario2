<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandeja de Casos - Sistema de Quejas Bancario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/styles.css" rel="stylesheet">
</head>
<body>
<div id="spinnerOverlay" class="spinner-overlay">
    <div class="spinner-border text-primary" role="status"></div>
</div>
<div id="navbar"></div>

<div class="container">
    <div id="alertas"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4><i class="bi bi-inbox me-2"></i>Mi Bandeja de Casos</h4>
        <select class="form-select w-auto" id="filtroEstado" onchange="cargarBandeja()">
            <option value="">Todos los estados</option>
            <option value="Asignado">Asignado</option>
            <option value="En atención">En atención</option>
            <option value="En espera">En espera</option>
            <option value="Resuelto">Resuelto</option>
            <option value="Cerrado">Cerrado</option>
        </select>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>No. Caso</th>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Cliente</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tablaBandeja">
                <tr><td colspan="6" class="text-center text-muted">Cargando...</td></tr>
            </tbody>
        </table>
    </div>

    <footer class="footer-umg">Universidad Mariano Gálvez de Guatemala &middot; Análisis de Sistemas II</footer>
</div>

<!-- Modal Detalle de Caso -->
<div class="modal fade" id="modalDetalle" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detalle del Caso</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="cuerpoDetalle">Cargando...</div>
      <div class="modal-footer" id="pieDetalle"></div>
    </div>
  </div>
</div>

<!-- Modal Resolver Caso -->
<div class="modal fade" id="modalResolver" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Resolver Caso</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertasResolver"></div>
        <label class="form-label">Detalle de la resolución *</label>
        <textarea class="form-control" id="detalleResolucion" rows="4" required></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-success" onclick="confirmarResolver()">Confirmar Resolución</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Solicitar Reasignacion -->
<div class="modal fade" id="modalReasignar" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Solicitar Reasignación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertasReasignar"></div>
        <label class="form-label">Motivo de la reasignación *</label>
        <textarea class="form-control" id="motivoReasignacion" rows="4" required></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-warning" onclick="confirmarReasignacion()">Enviar Solicitud</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="js/agente.js"></script>
</body>
</html>
