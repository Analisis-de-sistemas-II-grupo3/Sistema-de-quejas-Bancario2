<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Quejas Bancario - Iniciar Sesión</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div id="spinnerOverlay" class="spinner-overlay">
    <div class="spinner-border text-primary" role="status"></div>
</div>

<div class="container">
    <div class="card card-login shadow-sm">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-bank2" style="font-size: 2.5rem; color: var(--umg-azul);"></i>
                <h4 class="mt-2 mb-0">Sistema de Quejas Bancario</h4>
                <small class="text-muted">Ingrese sus credenciales</small>
            </div>

            <div id="alertas"></div>

            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="nombreUsuario" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                <div class="text-center mt-3">
                    <a href="forgot-password.html" class="small">¿Olvidó su contraseña?</a>
                </div>
            </form>
        </div>
    </div>
    <footer class="footer-umg">
        Universidad Mariano Gálvez de Guatemala &middot; Análisis de Sistemas II
    </footer>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
