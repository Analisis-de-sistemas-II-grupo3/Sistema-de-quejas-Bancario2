<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar Contraseña</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div id="spinnerOverlay" class="spinner-overlay">
    <div class="spinner-border text-primary" role="status"></div>
</div>
<div class="container">
    <div class="card card-login shadow-sm">
        <div class="card-body p-4">
            <h5 class="mb-3">Recuperar contraseña</h5>
            <p class="text-muted small">Ingrese el correo electrónico asociado a su usuario. Le enviaremos un enlace para restablecer su contraseña.</p>
            <div id="alertas"></div>
            <form id="formForgot">
                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correoElectronico" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
                <div class="text-center mt-3">
                    <a href="index.html" class="small">Volver a inicio de sesión</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById("formForgot").addEventListener("submit", async (e) => {
    e.preventDefault();
    const correoElectronico = document.getElementById("correoElectronico").value.trim();
    mostrarCargando(true);
    try {
        const resp = await apiFetch("/auth/forgot-password", { method: "POST", body: { correoElectronico } });
        mostrarAlerta("alertas", resp.mensaje, "success");
    } catch (err) {
        mostrarAlerta("alertas", err.message);
    } finally {
        mostrarCargando(false);
    }
});
</script>
</body>
</html>
