<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Casos - Sistema de Quejas Bancario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/styles.css" rel="stylesheet">
</head>
<body>
<div id="spinnerOverlay" class="spinner-overlay">
    <div class="spinner-border text-primary" role="status"></div>
</div>

<div id="navbar"></div>

<div class="container">
    <div id="alertas"></div>

    <!-- Seccion: Mis Casos -->
    <section id="seccionMisCasos">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4><i class="bi bi-folder2-open me-2"></i>Mis Casos</h4>
            <button class="btn btn-primary" onclick="mostrarSeccion('seccionRegistrar')">
                <i class="bi bi-plus-circle me-1"></i>Registrar nuevo caso
            </button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>No. Caso</th>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Agente asignado</th>
                        <th>Estado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tablaMisCasos">
                    <tr><td colspan="6" class="text-center text-muted">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- Seccion: Registrar Caso -->
    <section id="seccionRegistrar" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4><i class="bi bi-file-earmark-plus me-2"></i>Registrar Caso</h4>
            <button class="btn btn-outline-secondary" onclick="mostrarSeccion('seccionMisCasos')">
                <i class="bi bi-arrow-left me-1"></i>Volver a Mis Casos
            </button>
        </div>
        <div class="card">
            <div class="card-body">
                <div id="alertasRegistrar"></div>
                <form id="formRegistrarCaso">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Tipo de Caso *</label>
                            <select class="form-select" id="idTipoCaso" required></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Cuenta bancaria *</label>
                            <select class="form-select" id="numeroCuenta" required></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Producto/Servicio relacionado</label>
                            <select class="form-select" id="idProducto">
                                <option value="">-- No aplica --</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nombre completo *</label>
                            <input type="text" class="form-control" id="nombreCliente" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">DPI / NIT *</label>
                            <input type="text" class="form-control" id="identificacionCliente" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Correo de contacto *</label>
                            <input type="email" class="form-control" id="correoContacto" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Teléfono de contacto</label>
                            <input type="text" class="form-control" id="telefonoContacto">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Descripción del caso *</label>
                            <textarea class="form-control" id="descripcion" rows="4" maxlength="2000" required></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Documento de soporte (opcional, PDF o imagen, máx. 2MB)</label>
                            <input type="file" class="form-control" id="archivo" accept=".pdf,.jpg,.jpeg,.png">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4">
                        <i class="bi bi-send me-1"></i>Registrar Caso
                    </button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer-umg">Universidad Mariano Gálvez de Guatemala &middot; Análisis de Sistemas II</footer>
</div>

<!-- Modal Detalle de Caso -->
<div class="modal fade" id="modalDetalle" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detalle del Caso</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="cuerpoDetalle">Cargando...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="js/cliente.js"></script>
</body>
</html>
