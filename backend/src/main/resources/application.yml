server:
  port: 8080

  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: quejas-bancario-backend


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:

      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: America/Guatemala
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  # ---------------------------------------------------------------
  # Correo SMTP real (CU-11 / RN09).
  # ---------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 horas
  mail:
    from: ${MAIL_FROM:no-responder@quejasbancario.com}
    from-name: "Sistema de Quejas Bancario"
  frontend:
    reset-password-url: ${FRONTEND_RESET_URL:http://localhost:5500/reset-password.html}
  seguridad:
    max-intentos-fallidos: 5
    bloqueo-minutos: 1
    reset-token-minutos: 30
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173}
  # Limite de consultas por IP a /api/publico/casos/** (evita recorrer numeros de caso)
  rate-limit:
    max-peticiones: ${RATE_LIMIT_MAX:10}
    ventana-segundos: ${RATE_LIMIT_VENTANA_SEG:60}
  # ---------------------------------------------------------------
  # Identidad institucional (RN17, CU-00 Portal).
  # Para desplegar el sistema en otro banco basta con cambiar estos valores
  # (o las variables de entorno INSTITUCION_*); no se toca el codigo.
  # Cada instancia sirve a un unico banco.
  # ---------------------------------------------------------------
  institucion:
    nombre: "${INSTITUCION_NOMBRE:Banco Aurora}"
    eslogan: "${INSTITUCION_ESLOGAN:Un nuevo horizonte para ti.}"
    logo-url: "${INSTITUCION_LOGO_URL:img/logo-aurora.svg}"
    color-primario: "${INSTITUCION_COLOR_PRIMARIO:#0B2545}"
    color-secundario: "${INSTITUCION_COLOR_SECUNDARIO:#1AB8B0}"
    color-acento: "${INSTITUCION_COLOR_ACENTO:#E8B04B}"
    mision: >-
      Facilitar a las personas y empresas de Guatemala el acceso a productos y servicios
      financieros confiables, brindando una atención cercana, ágil y transparente que
      resuelva sus necesidades y fortalezca su bienestar económico.
    vision: >-
      Ser la institución financiera de referencia en Guatemala por su solidez, innovación
      tecnológica y calidad en el servicio, reconocida por escuchar activamente a sus
      clientes y actuar con integridad en cada interacción.
    valores:
      - nombre: Transparencia
        descripcion: Comunicamos con claridad cada proceso y decisión relacionada con los casos de nuestros clientes.
      - nombre: Integridad
        descripcion: Actuamos con honestidad y coherencia entre lo que decimos y lo que hacemos.
      - nombre: Compromiso
        descripcion: Nos responsabilizamos por dar seguimiento oportuno a cada caso hasta su resolución.
      - nombre: Excelencia
        descripcion: Buscamos la mejora continua en cada punto de contacto con nuestros clientes.

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.umg.quejasbancario: INFO
    org.springframework.security: WARN
