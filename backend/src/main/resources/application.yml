server:
  port: 8081

spring:
  application:
    name: quejas-bancario-backend

  # ---------------------------------------------------------------
  # Conexion a Neon (PostgreSQL). Reemplaza los valores o usa
  # variables de entorno (recomendado). Neon requiere SSL.
  # Ejemplo de URL que entrega Neon:
  # jdbc:postgresql://ep-xxxx-xxxx.us-east-2.aws.neon.tech/quejas_bancario?sslmode=require
  # ---------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://ep-rapid-union-axkm754p-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
    username: neondb_owner
    password: npg_ZXkRP9bSta4u
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      # 'validate' en producción (la BD ya existe en Neon).
      # Usa 'update' solo si quieres que Hibernate cree/ajuste tablas automáticamente.
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: America/Guatemala
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  # ---------------------------------------------------------------
  # Correo SMTP real (CU-11 / RN09). Ejemplo con Gmail:
  # host=smtp.gmail.com, port=587, usar "contrasena de aplicacion".
  # ---------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:tu_correo@gmail.com}
    password: ${MAIL_PASSWORD:tu_password_de_aplicacion}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:MiClaveSecretaSuperLargaYAleatoriaParaJWT2026ProyectoUMG.}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 horas
  mail:
    from: ${MAIL_FROM:no-responder@quejasbancario.com}
    from-name: "Sistema de Quejas Bancario"
  frontend:
    reset-password-url: ${FRONTEND_RESET_URL:http://localhost:5500/reset-password.html}
  seguridad:
    max-intentos-fallidos: 5
    bloqueo-minutos: 1
    reset-token-minutos: 30
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.umg.quejasbancario: INFO
    org.springframework.security: WARN
